# ~/.mahler/config.toml — only what differs from the defaults in mahler/config.py.
# Nothing is managed until a project here says enabled = true.

[ntfy]
topic = ""                      # optional: set an unguessable topic and subscribe in ntfy
# topic_high = "mahler-hi"      # optional: high-priority-only topic (priority="high" pings go here AND to topic)

[projects.example]
enabled = false                 # opt in only after repo, path and verify are correct
repo = "your-org/your-repo"
path = "/absolute/path/to/your-repo"
max_parallel = 1
verify = "python3 -m unittest discover -s tests"
# A project may span more than one account (DESIGN D26): by default it tries
# each of its accounts in declared order and spends the first with headroom.
# Set one of account/accounts, never both:
# accounts = ["personal", "work", "work-makastel"]
# For a project that's genuinely dual-use (both accounts equally preferred,
# not one a fallback for the other), opt into round-robin merging instead:
# account_mode = "equal"
# To set one exact platform order across several accounts, use priority mode
# plus a project route. Account isolation still applies: every named platform
# must spend one of the project's declared accounts. Each role the project
# uses needs its own exact route; an omitted role has no candidates.
# account_mode = "priority"
# routing = { sort = ["claude"], plan = ["claude-opus"], build = ["agy-claude", "work-codex-gpt1-medium", "work-codex-makastel-medium", "claude"] }

# A local macOS app with no shared test backend can use the same command for
# fast and full verification.  This is the checked, non-secret shape used by
# MoveBreak; replace the path with the primary checkout on this machine.
# [projects.movebreak]
# enabled = true
# repo = "mkny13/movebreak"
# path = "/absolute/path/to/movebreak"
# worktree_root = "/absolute/path/to/.mahler-worktrees"
# max_parallel = 1
# verify = "./scripts/build_app.sh"
# accounts = ["personal", "work"]

# Only on a second machine that shares this project (DESIGN D24). The Mac mini
# remains canonical and does not set this table. Authorize this machine's SSH
# public key on the Mini and accept its host key before enabling the daemon.
# [projects.example.remote_ledger]
# host = "user@canonical-host.example-tailnet.ts.net"
# client_id = "work-laptop"        # stable and unique among Mahler machines
# connect_timeout_seconds = 5
# command = "~/.mahler/app/bin/mahler"
# If non-interactive SSH does not put Python 3.12+ first on PATH:
# command = ["/opt/homebrew/bin/python3", "~/.mahler/app/bin/mahler"]

# [projects.example.maintenance]
# enabled = true
# cadence_days = 30
# merged_threshold = 20
# cooldown_days = 14
# passes = ["security", "health", "drift", "tests", "token-economy", "guidance", "backlog", "bugs", "docs"]

# Periodic self-audit of platform tier/capability assumptions (DESIGN D20,
# mahler#206) — global, not per-project: it's about mahler/config.py's own
# tier/max_size/min_size judgment calls, not a managed project's codebase.
# [platform_audit]
# enabled = true
# project = "example"            # whose merged-PR throughput anchors the checkpoint
# cadence_days = 30
# merged_threshold = 20
# cooldown_days = 14
# stale_verified_days = 90       # DESIGN.md "verified" date older than this is flagged

# [routing]
# plan = ["claude-opus"]         # goals, audits, size:l → Opus only (DESIGN D21)
# sort = ["claude", "agy-gemini", "agy-claude"]
# build = ["agy-claude", "agy-gemini", "cline-free", "copilot", "copilot-high", "kilo", "agy-gemini-pro", "claude-opus", "claude"]
# A machine logged into ChatGPT through Codex CLI can opt in explicitly:
# plan = ["codex", "claude-opus"]
# sort = ["codex", "claude", "agy-gemini", "agy-claude"]
# build = ["codex", "copilot", "agy-claude", "agy-gemini", "cline-free", "kilo"]

# Work logins on this same machine (DESIGN D25). Log each CLI in once with its
# env var set (e.g. `CLAUDE_CONFIG_DIR=~/.claude-work claude`, then /login).
# A work project spends only work platforms; nothing ever falls back to yours.
# [accounts.work]
# env = { CLAUDE_CONFIG_DIR = "~/.claude-work", COPILOT_HOME = "~/.copilot-work", CODEX_HOME = "~/.codex-work" }
# # env can also carry GH_CONFIG_DIR = "~/.config/gh-work" if the work repos need a
# # different GitHub login; set that checkout's git credential helper to match.
# # Zero-token Claude readings for this login (else a lean probe on the work login):
# # claude_keychain_service = "Claude Code-credentials-xxxxxxxx"
# routing = { sort = ["work-claude-medium"], plan = ["work-claude-high", "work-codex-gpt1-high", "work-codex-gpt1-astra"], build = ["work-copilot", "work-codex-gpt1-low", "work-codex-gpt1-medium", "work-codex-gpt1-high", "work-codex-gpt1-astra", "work-claude-high", "work-claude-medium", "work-claude-low"] }
#
# [platforms.work-claude-low]
# from = "claude-low"
# account = "work"
# [platforms.work-claude-medium]
# from = "claude"
# account = "work"
# [platforms.work-claude-high]
# from = "claude-opus"
# account = "work"
# [platforms.work-codex-gpt1-low]
# from = "codex-low"
# account = "work"
# [platforms.work-codex-gpt1-medium]
# from = "codex"
# account = "work"
# [platforms.work-codex-gpt1-high]
# from = "codex-high"
# account = "work"
# model = "gpt-5.6-sol"
# tier = 4
# [platforms.work-codex-gpt1-astra]
# from = "codex-high"
# account = "work"
# model = "gpt-6-astra"
# tier = 5
# [platforms.work-copilot]
# from = "copilot"
# account = "work"
# metered = false                   # manual override for an org seat or no work gh login
# With metering enabled, an empty personal AI-credits report automatically shows
# no quota signal and is retried after stale_minutes (Copilot default 360). It cannot
# identify a seat type: an unused personal plan can also return an empty report.
#
# A second ChatGPT-only login is another account with its own CODEX_HOME and
# inherited Codex platforms. Authenticate it once with CODEX_HOME set; never
# copy auth.json between accounts.
# [accounts.work-makastel]
# env = { CODEX_HOME = "~/.codex-ncsu" }
# routing = { build = ["work-codex-makastel-low", "work-codex-makastel-medium", "work-codex-makastel-high"] }
# [platforms.work-codex-makastel-low]
# from = "codex-low"
# account = "work-makastel"
# [platforms.work-codex-makastel-medium]
# from = "codex"
# account = "work-makastel"
# [platforms.work-codex-makastel-high]
# from = "codex-high"
# account = "work-makastel"
# Model and capability are always ordered from general to specific:
# work-codex-gpt1-high, never codex-high-work-gpt1. The account is part of
# every slot, so quota probes remain distinct. GPT1 additionally exposes
# Astra; do not add it to another login until it is verified.
# A priority route can place work-codex-gpt1-medium before
# work-codex-makastel-medium and both before Claude, with separate probes.
# Repository changes never rewrite the daemon's operator-owned
# ~/.mahler/config.toml. Activate a new login by adding its account, platforms,
# and project route there, then run `mahler usage --probe`. Capacity shows one
# row per quota group, so low/medium/high/Astra siblings appear under their
# base login row.
#
# [projects.acme]
# enabled = true
# account = "work"
# repo = "acme-corp/app"
# path = "/absolute/path/to/work/app"
# size_target = "s"                 # "" or "s" (decompose to small PRs). Default: "s" for work projects, "" for others.

# [claude_peak]
# # Claude's peak window (D22): on weekdays 5-11am Pacific, Mahler starts no new
# # Claude runs. Running work continues, and the hard lines still apply.
# # Override with `mahler peak --off [--for DURATION]`, or by pinning an item to
# # a Claude platform. `enabled = false` turns the window off entirely.
# enabled = true
# tz = "America/Los_Angeles"
# weekdays = [0, 1, 2, 3, 4]        # Python weekday(): Mon=0 .. Sun=6
# start = "05:00"
# end = "11:00"

# [burst]
# enabled = true                 # burst before a Claude window resets (D23)
# weekly_lead_hours = 5          # before the weekly reset
# session_lead_minutes = 60      # before the 5-hour reset
# soft = 90                      # burst soft line (still below 100%)
# hard = 97                      # burst hard line (still below 100%)
# human_quiet_minutes = 20       # suppress burst after detected human use

# Opt-in weekly pacing: release 1/7 of the weekly targets per elapsed cycle day.
# Set on each platform that should be paced (or its inherited base).
# [platforms.claude]
# progressive = ["weekly"]
# soft.weekly = 40
# hard.weekly = 49
# Missing reset times use day one's allowance; expired/stale samples block starts.
# [burst] also covers work Claude, using each quota group's own reset times.
# Weekly bursts override pacing; session bursts preserve the weekly allowance.
