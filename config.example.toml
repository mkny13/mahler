# Opt-in measured routing (D33). Defaults to list order.
# A project may override this with routing_mode = "list" or "measured".
# Free pools always stay ahead of paid personal quota, so measured routing is
# safe to enable for personal projects even while candidates are unproven.
routing_mode = "list"

# ~/.mahler/config.toml — only what differs from the defaults in mahler/config.py.
# Nothing is managed until a project here says enabled = true.

# Optional daemon-only GitHub App identity. Omit the whole table to keep gh auth.
# The global installation applies only to the effective personal GitHub account
# (gh_account, else first account/accounts entry, else personal). Work accounts
# use their own gh credentials unless explicitly opting into an installation below.
# Requires openssl and an installed App with repository permissions for the
# conductor's operations (contents, issues, pull requests, checks/actions reads).
# Store the private key securely; neither it nor tokens belong in account env.
# Tokens are cached privately under MAHLER_HOME/github-app-tokens (0700/0600).
# [github_app]
# app_id = 12345
# installation_id = 67890
# private_key_path = "/absolute/path/to/private-key.pem"

[defaults]
# Distinct green heads with usable reviews; inclusive, positive integer.
review_green_rounds = 2
# Operating context for independent reviews; inherited by every project.
review_context = "Personal project: a single user owns and controls all devices and upgrades them together."
# Desktop gate (D40): GUI-driving commands run only when the mini's keyboard/mouse have
# been idle this many minutes. Positive number; per-project override allowed.
gui_idle_minutes = 15
# Preferred local window (start inclusive, end exclusive, may cross midnight) enforced only
# for `mahler desktop ... --scheduled`; "" disables it. Per-project override allowed.
gui_window = "00:00-06:00"

[ntfy]
topic = ""                      # optional: set an unguessable topic and subscribe in ntfy
# topic_high = "mahler-hi"      # optional: high-priority-only topic (priority="high" pings go here AND to topic)

# Optional post-merge deploy/live/smoke execution contract.
# Defaults and per-project tables merge recursively. Keep disabled until configured.
# Uses projects.<name>.smoke above/below; never define post_merge.smoke.
# Commands and references must contain no credentials; use account-owned secret stores.
# [projects.example.post_merge]
# enabled = false
# deploy_strategy = "watch"       # watch external deploy, or command to initiate it
# deploy_command = ""             # required for command, empty for watch
# live_strategy = "command"       # command, mahler, or github
# live_command = "./scripts/check-live.sh"  # required for command; empty for built-ins
# environment = "staging"         # preview/staging default; production is explicit
# timeout_seconds = 1800          # integer 1–86400, total durable check deadline
# auto_revert = false             # opt-in policy only; prepare a guarded revert PR on failure
# The runner supplies the exact merge SHA, tag and artifact context.
# Empty smoke cannot produce PASS; D11 defines identity, reports and D10 handoff.

# Fixture-backed built-in examples (tests/test_post_merge.py, test_gh.py,
# test_launch_health.py). Activation and real deployment proof are separate.
# [projects.mahler.post_merge]
# enabled = false
# deploy_strategy = "watch"
# live_strategy = "mahler"
# live_command = ""
# environment = "daemon"          # read-only installed version health check
# timeout_seconds = 1800
# Requires MAHLER_HOME/launch_ok and MAHLER_HOME/app HEAD == the merge SHA.
# Runs installed python -m mahler version, then the project's smoke command.
#
# [projects.preview_web.post_merge]
# enabled = false
# deploy_strategy = "watch"
# live_strategy = "github"
# live_command = ""
# environment = "Preview"         # exact GitHub environment; never prod/production
# timeout_seconds = 1800
# Uses projects.preview_web.repo and gh_account. The latest deployment must be
# the sole record for this SHA, non-production, with a latest success status.
# Its HTTPS environment_url (no credentials/query/fragment) becomes
# MAHLER_ARTIFACT_REF for the existing project smoke command.

[projects.example]
enabled = false                 # opt in only after repo, path and verify are correct
repo = "your-org/your-repo"
path = "/absolute/path/to/your-repo"
max_parallel = 1
# Adopt safe bot dependency PRs; override either setting per project.
dependency_prs = true
dependency_prs_daily_cap = 3 # successful adoptions per local calendar day
# Override for shared apps, or set review_context = "" to clear inherited assumptions.
# review_context = "Multiple users upgrade their devices independently."
# review_green_rounds = 3        # optional per-project override
# github_app_installation_id = 98765  # explicit App opt-in/override for any account
# Explore unproven variants on a deterministic share of low-risk, unpinned items.
# Defaults to true with a personal account, false for work-only projects.
# explore = false
verify = "python3 -m unittest discover -s tests"
# Optional smoke command against the latest preview/beta artifact after release.
# Empty disables it, including a command inherited from [defaults].
# Schema only: Mahler does not execute commands or post smoke reports yet.
# See DESIGN D11 for release context, report grammar and evidence requirements.
smoke = ""
# smoke = "./scripts/smoke/run-smoke.sh"  # illustrative; runner interface is deferred
# Optional advisory screenshot capture after CI and before review.
# These settings inherit [defaults]; an empty command explicitly disables capture.
screenshot = ""
screenshot_environment = ""       # must explicitly name the preview environment
screenshot_preview_non_personal = false  # strict boolean; local-only by default
screenshot_timeout_seconds = 45    # integer 1–60
screenshot_path = []              # inherited operator absolute executable directories
# screenshot_path = ["/opt/capture/bin"]
# PATH: resolved screenshot_path entries, /opt/homebrew/bin, /usr/local/bin, os.defpath.
# Never inherit daemon PATH; relative, empty and colon-separated entries are invalid.
# Configured directories resolving inside the exact PR worktree are refused.
# screenshot = "/opt/mahler-screenshots/capture"  # operator-installed executable
# Absolute executable path only, no shell/arguments; tools in Git checkouts are refused.
# Install the tool and its browser dependencies outside all project checkouts.
# It must not load scripts, configuration or dependencies from PR worktrees.
# Verify an exact-head checkout exists, but run the trusted tool in a fresh directory
# with a minimal environment (no inherited credentials) and temporary HOME/profile.
# Capture the exact-head preview with headless Chromium and a fresh profile/context.
# Never use real Chrome, extensions, saved cookies or personal authentication state.
# Inputs: MAHLER_SCREENSHOT_URL (preview), MAHLER_SCREENSHOT_DIR (output),
# MAHLER_SCREENSHOT_PROFILE_DIR (fresh profile), MAHLER_SCREENSHOT_SHA (head),
# MAHLER_SCREENSHOT_PR (number). Repo project.toml describes this; it is not loaded.
# Output manifest.json:
# {"version":1,"sha":"<head>","screenshots":[{"route":"/sign-in","file":"sign-in.png"}]}
# Matching SHA; 1–10 unique relative PNG files; no query/fragment in route labels.
# Limits: 64 KiB manifest, 2 MiB/file, 20 MiB total; PNG signature required.
# Reject traversal, absolute paths, symlinks, missing/non-regular files, malformed
# JSON, duplicate fields/files and invalid versions. See DESIGN D11 for full rules.
# Private persistent artifacts: MAHLER_HOME/screenshots/<project>/<PR>/<head>/.
# Capture head stays separate from the later squash-merge SHA in lifecycle KV.
# Without explicit non-personal=true, PNGs/routes stay local for the console;
# reviewer/PR receive generic status only. True permits attempted publication.
# Unavailable/failed captures are advisory: never a UAT pass or merge gate.
# A project may span more than one account (DESIGN D26): by default it tries
# each of its accounts in declared order and spends the first with headroom.
# Set one of account/accounts, never both:
# accounts = ["personal", "work", "work-makastel"]
# For a project that's genuinely dual-use (both accounts equally preferred,
# not one a fallback for the other), opt into round-robin merging instead:
# account_mode = "equal"
# To set one exact platform order across several accounts, use priority mode
# plus a project route. Account isolation still applies: every named platform
# must spend one of the project's declared accounts. Each role the project
# uses needs its own exact route; an omitted role has no candidates.
# account_mode = "priority"
# routing = { sort = ["claude"], plan = ["claude-opus"], build = ["@shared-build"] }

# A local macOS app with no shared test backend can use the same command for
# fast and full verification.  This is the checked, non-secret shape used by
# MoveBreak; replace the path with the primary checkout on this machine.
# [projects.movebreak]
# enabled = true
# repo = "mkny13/movebreak"
# path = "/absolute/path/to/movebreak"
# worktree_root = "/absolute/path/to/.mahler-worktrees"
# max_parallel = 1
# verify = "./scripts/build_app.sh"
# accounts = ["personal", "work"]

# Only on a second machine that shares this project (DESIGN D24). The Mac mini
# remains canonical and does not set this table. Authorize this machine's SSH
# public key on the Mini and accept its host key before enabling the daemon.
# [projects.example.remote_ledger]
# host = "user@canonical-host.example-tailnet.ts.net"
# client_id = "work-laptop"        # stable and unique among Mahler machines
# connect_timeout_seconds = 5
# command = "~/.mahler/app/bin/mahler"
# If non-interactive SSH does not put Python 3.12+ first on PATH:
# command = ["/opt/homebrew/bin/python3", "~/.mahler/app/bin/mahler"]

# [projects.example.maintenance]
# enabled = true
# cadence_days = 30
# merged_threshold = 20
# cooldown_days = 14
# gate-coverage audits shipped targets against verify, PR CI and release-only checks;
# recommends fixes without editing private config. Omit it from passes to opt out.
# escapes groups recently closed bugs into deduplicated mechanical-check proposals;
# default-on, omit it from passes to opt out.
# passes = ["security", "health", "drift", "tests", "token-economy", "guidance", "backlog", "bugs", "docs", "gate-coverage", "escapes"]

# Periodic self-audit of platform tier/capability assumptions (DESIGN D20,
# mahler#206) — global, not per-project: it's about mahler/config.py's own
# tier/max_size/min_size judgment calls, not a managed project's codebase.
# [platform_audit]
# enabled = true
# project = "example"            # whose merged-PR throughput anchors the checkpoint
# cadence_days = 30
# merged_threshold = 20
# cooldown_days = 14
# stale_verified_days = 90       # DESIGN.md "verified" date older than this is flagged

# Cross-project practices audit (DESIGN D39; policy only until scanner/tick
# integration ships). Proposes issues; never edits audited repos or settings.
# Scans only enabled projects, using the fixed six PRACTICES_AUDIT_CHECKS.
# Uncomment this table and set enabled = false to disable the whole pass.
# [practices_audit]
# enabled = true
# project = "mahler"            # enabled anchor project: report + merged-PR count
# cadence_days = 30             # due after this interval OR merged_threshold
# merged_threshold = 20         # only conductor-confirmed merges in the anchor
# cooldown_days = 14            # minimum interval even when volume triggers
# Override project for installations without an enabled mahler project.
# Missing/disabled anchors skip the pass. Project maintenance settings do not
# select its checks. Proposals inherit each affected project's scope_label
# when scope = "label" (including custom labels; no repository allowlist).

# Define routes once; @references work globally, in accounts, and in projects.
# Nested groups expand in order; the first occurrence of each platform wins.
# Unknown/cyclic references are skipped with a `mahler status` warning.
# Priority projects reject broken references and undeclared accounts.
# The console preserves @tokens when saving settings.
# [groups]
# free = ["agy-claude", "agy-gemini", "cline-free", "copilot", "kilo"]
# personal-build = ["@free", "copilot-high", "agy-gemini-pro", "claude-opus", "claude"]
# work-plan = ["work-claude-high", "work-codex-gpt1-high", "work-codex-gpt1-astra"]
# work-build = ["work-copilot", "work-codex-gpt1-low", "work-codex-gpt1-medium", "work-codex-gpt1-high", "work-codex-gpt1-astra", "work-claude-high", "work-claude-medium", "work-claude-low"]
# makastel = ["work-codex-makastel-low", "work-codex-makastel-medium", "work-codex-makastel-high"]
# shared-build = ["@free", "@work-build", "@makastel", "claude"]

# [routing]
# plan = ["claude-opus"]         # goals, audits, size:l → Opus only (DESIGN D21)
# sort = ["claude", "agy-gemini", "agy-claude"]
# build = ["@personal-build"]
# A machine logged into ChatGPT through Codex CLI can opt in explicitly:
# plan = ["codex", "claude-opus"]
# sort = ["codex", "claude", "agy-gemini", "agy-claude"]
# build = ["codex", "@free"]

# Opt-in to Kiro CLI (kiro.ai). Disabled by default; enable it per machine.
# Kiro bills in monthly credits (KIRO FREE = 50/month). The /usage probe is
# sent automatically once stale_minutes have passed (default 360).
# [platforms.kiro]
# enabled = true
# # model = "auto"          # adaptive selection (default)
# # Or pin a specific model from `kiro-cli chat --list-models`.
# # effort = "medium"         # low | medium | high | xhigh | max
# # max_size = "s"           # Kiro's default plan caps to small items

# Opt-in to Mistral Vibe CLI (`uv tool install mistral-vibe`). Disabled by
# default and in no default route. Needs MISTRAL_API_KEY in ~/.vibe/.env
# (mode 600) from a La Plateforme Free-mode workspace. NEVER enable
# pay-as-you-go on that workspace: Mahler never spends real money (D8).
# Only codestral-latest and open models work on the free plan; Mahler pins the
# model in a per-run VIBE_HOME. Unmetered, with a 60-minute backoff on 429.
# [platforms.vibe]
# enabled = true
# # model = "codestral-latest"
# [routing]
# build = ["agy-claude", "agy-gemini", "cline-free", "copilot", "kilo", "vibe", "claude"]

# Team-plan Claude API credits (DESIGN D41, mahler#903). Work account only:
# validation refuses an enabled credits platform on any other account. The
# credits do NOT cover Claude Code, so the real key never goes to a run
# directly: a standard-library gateway (mahler/api_credits.py Gateway) is the
# only thing that holds it, forwarding only approved models/token bounds
# after reserving each request's worst-case cost against the ledger.
# NOT YET WIRED TO A WORKING HARNESS (live-tried 2026-10-10, see D41): Cline's
# direct anthropic provider cannot reach the gateway at all. Leave enabled =
# false until D41's harness rework lands. Both keys live only in the mini's
# login keychain:
#   security add-generic-password -s mahler-anthropic-api   -a work -w   # workspace key
#   security add-generic-password -s mahler-anthropic-admin -a work -w   # sk-ant-admin… (Cost API)
# The daemon (a LaunchAgent in the GUI session) reads them per run/probe; over
# ssh the keychain is locked and reads fail closed with a "keychain locked" ping.
#
# Spending is authorized only inside a confirmed grant (D41 step 3) — never
# inferred from cycle_anchor_day/time, which are forecast-only (display: where
# the *next* grant is expected). Add one [[api_credits.grants]] entry per
# confirmed grant Console shows; an expired or not-yet-confirmed window simply
# refuses spending, allowance included.
# [api_credits]
# enabled = true
# account = "work"
# pool_usd = 260                 # the org's grant size; edit as seats change
# allowance_usd = 20             # Mahler's at-will share per grant
# cycle_anchor_day = 15          # forecast only — the next grant is expected around this UTC day
# cycle_anchor_time = "00:00"    # UTC
# burst_lead_hours = 48          # then the line is pool − org spend − margin
# safety_margin_usd = 10
# run_reserve_usd = 5            # per-run bound: needed to start, held while live
# workspace_id = "wrkspc_…"      # Mahler's Console workspace (its own spend)
# api_key_expires = "2027-10-16T20:00:00-04:00"
# admin_key_expires = "2027-10-16"
# allowed_models = ["claude-sonnet-5-5"]   # the gateway refuses any other model
# max_output_tokens = 8192                # the gateway refuses a higher max_tokens
# gateway_host = "127.0.0.1"               # loopback only — validated
# base_url_env = "ANTHROPIC_BASE_URL"      # how the harness is pointed at the gateway
#
# [[api_credits.grants]]                   # one entry per confirmed grant (Mike/Console)
# granted_at = "2026-10-09"
# expires_at = "2026-10-15T00:00:00Z"      # a conservative cutoff if no exact instant is exposed
# pool_usd = 260
#
# [platforms.work-claude-api]
# from = "claude-api"            # kind cline, provider anthropic, claude-sonnet-5-5
# account = "work"
# enabled = true
# [accounts.work]
# routing = { build = ["…", "work-claude-api"] }

# Optional per-platform reasoning effort. Supported values depend on the CLI;
# invalid values are ignored and reported by `mahler status`.
# [platforms.work-codex-gpt1-low]
# effort = "low"
# Claude also accepts role-specific overrides: sort_effort = "low" and
# build_effort = "high" (these take precedence over effort).

# Several model x effort options on one login, sharing its one run slot
# (D33, issue #420). Each entry is "model" or "model@effort"; at load, each
# expands into a synthetic platform named "<slot>/<model>/<effort or
# default>" — e.g. work-codex-gpt1/gpt-6-luna/low — that shares this slot's
# quota_group, so max_runs is still counted across every variant together.
# The slot's own name (work-codex-gpt1-low here) is untouched and stays the
# default variant, so existing routing, pins, labels and history stay valid.
# Add a variant name to a routing list or a `platform:` pin to use it.
# Variants inherit their slot's cost class. By default personal `kind =
# "claude"` slots are paid and every other slot (including work-account
# Claude) is free. An unusual slot can override that classification:
# cost_class = "free" # or "paid"
# [platforms.work-codex-gpt1-low]
# variants = ["gpt-6-luna@low", "gpt-6-luna@medium", "gpt-5.6-luna"]
# variant_tiers = { "gpt-6-luna@medium" = 2 }   # default: this slot's own tier
# Built-in personal slots already provide incumbent-first candidates:
# codex-low: gpt-5.6-luna, then GPT-6 Luna low/medium/high
# codex: gpt-5.6-terra, then GPT-6 Luna high and GPT-6 Sol low
# claude: claude-sonnet-5-5, then Sonnet 5.5 low/high and Opus 5.5 low
# claude-opus: Opus 5.5 default/medium/high
# agy-gemini: current Pro, then Gemini Flash low/medium

# Work logins on this same machine (DESIGN D25). Log each CLI in once with its
# env var set (e.g. `CLAUDE_CONFIG_DIR=~/.claude-work claude`, then /login).
# A work project spends only work platforms; nothing ever falls back to yours.
# [accounts.work]
# env = { CLAUDE_CONFIG_DIR = "~/.claude-work", COPILOT_HOME = "~/.copilot-work", CODEX_HOME = "~/.codex-work" }
# # env can also carry GH_CONFIG_DIR = "~/.config/gh-work" if the work repos need a
# # different GitHub login; set that checkout's git credential helper to match.
# # Zero-token Claude readings for this login (else a lean probe on the work login):
# # claude_keychain_service = "Claude Code-credentials-xxxxxxxx"
# routing = { sort = ["work-claude-medium"], plan = ["@work-plan"], build = ["@work-build"] }
#
# [platforms.work-claude-low]
# from = "claude-low"
# account = "work"
# [platforms.work-claude-medium]
# from = "claude"
# account = "work"
# [platforms.work-claude-high]
# from = "claude-opus"
# account = "work"
# [platforms.work-codex-gpt1-low]
# from = "codex-low"
# account = "work"
# [platforms.work-codex-gpt1-medium]
# from = "codex"
# account = "work"
# [platforms.work-codex-gpt1-high]
# from = "codex-high"
# account = "work"
# model = "gpt-5.6-sol"
# tier = 4
# [platforms.work-codex-gpt1-astra]
# from = "codex-high"
# account = "work"
# model = "gpt-6-astra"
# tier = 5
# [platforms.work-copilot]
# from = "copilot"
# account = "work"
# metered = false                   # manual override for an org seat or no work gh login
# With metering enabled, an empty personal AI-credits report automatically shows
# no quota signal and is retried after stale_minutes (Copilot default 360). It cannot
# identify a seat type: an unused personal plan can also return an empty report.
#
# A second ChatGPT-only login is another account with its own CODEX_HOME and
# inherited Codex platforms. Authenticate it once with CODEX_HOME set; never
# copy auth.json between accounts.
# [accounts.work-makastel]
# env = { CODEX_HOME = "~/.codex-ncsu" }
# routing = { build = ["@makastel"] }
# [platforms.work-codex-makastel-low]
# from = "codex-low"
# account = "work-makastel"
# [platforms.work-codex-makastel-medium]
# from = "codex"
# account = "work-makastel"
# [platforms.work-codex-makastel-high]
# from = "codex-high"
# account = "work-makastel"
# Model and capability are always ordered from general to specific:
# work-codex-gpt1-high, never codex-high-work-gpt1. The account is part of
# every slot, so quota probes remain distinct. GPT1 additionally exposes
# Astra; do not add it to another login until it is verified.
# A priority route can place work-codex-gpt1-medium before
# work-codex-makastel-medium and both before Claude, with separate probes.
# Repository changes never rewrite the daemon's operator-owned
# ~/.mahler/config.toml. Activate a new login by adding its account, platforms,
# and project route there, then run `mahler usage --probe`. Capacity shows one
# row per quota group, so low/medium/high/Astra siblings appear under their
# base login row.
#
# [projects.acme]
# enabled = true
# account = "work"
# repo = "acme-corp/app"
# path = "/absolute/path/to/work/app"
# size_target = "s"                 # "" or "s" (decompose to small PRs). Default: "s" for work projects, "" for others.

# [claude_peak]
# # Claude's peak window (D22): on weekdays 5-11am Pacific, Mahler starts no new
# # Claude runs. Running work continues, and the hard lines still apply.
# # Override with `mahler peak --off [--for DURATION]`, or by pinning an item to
# # a Claude platform. `enabled = false` turns the window off entirely.
# enabled = true
# tz = "America/Los_Angeles"
# weekdays = [0, 1, 2, 3, 4]        # Python weekday(): Mon=0 .. Sun=6
# start = "05:00"
# end = "11:00"

# [burst]
# enabled = true                 # burst before a Claude window resets (D23)
# weekly_lead_hours = 5          # before the weekly reset
# session_lead_minutes = 60      # before the 5-hour reset
# soft = 90                      # burst soft line (still below 100%)
# hard = 97                      # burst hard line (still below 100%)
# human_quiet_minutes = 20       # suppress burst after detected human use

# Opt-in weekly pacing: release 1/7 of the weekly targets per elapsed cycle day.
# Set on each platform that should be paced (or its inherited base).
# [platforms.claude]
# progressive = ["weekly"]
# soft.weekly = 40
# hard.weekly = 49
# Missing reset times use day one's allowance; expired/stale samples block starts.
# [burst] also covers work Claude, using each quota group's own reset times.
# Weekly bursts override pacing; session bursts preserve the weekly allowance.

# Raw API-equivalent costs (USD per million tokens). CLI-reported cost wins.
# Built-in list prices supplied for issue #416, source date 2026-09-23.
# Issue #421 (D33): the built-in Claude slots now pin exact model IDs, so their
# prices are listed here too. Unknown prices stay NULL, never zero.
# cached_in defaults to in; reasoning tokens use out. Quota cost weights are
# applied by scorecard readers, never to the raw run cost stored in the ledger.
[prices."gpt-6-luna"]
in = 0.10
out = 0.50

[prices."gpt-6-sol"]
in = 2.00
out = 10.00

[prices."claude-opus-5-5"]
in = 4.00
cached_in = 0.20
out = 20.00

[prices."claude-haiku-4-5-20251001"]
in = 0.80
out = 4.00

[prices."claude-sonnet-5"]
in = 3.00
cached_in = 0.30
out = 15.00

[prices."claude-sonnet-5-5"]
in = 2.00
cached_in = 0.20
out = 10.00



# D33 model scorecard; measurement does not change routing by itself.
[measure]
min_attempts = 8
window_days = 60
bars = { build = 0.70, fix = 0.70, sort = 0.80, plan = 0.75 }
# Explores the cheapest unproven candidate using median tokens at this role/size.
# Before token history exists, compares an equal input/output token estimate.
# Unpriced models rank last; cost ties keep configured route order.
# Failed exploration preserves the attempt/escalation budget; the next run is normal.
explore_share = { build = 0.15, fix = 0.15, sort = 0.15, plan = 0.05 }

# Optional weighting of API-equivalent costs for a shared quota_group.
# Unspecified groups use 1.0; this never enables paid usage.
# [quota_groups.claude]
# cost_weight = 1.0
