[project]
name = "mahler-sdk-runner"
version = "0.1.0"
description = "Claude Agent SDK runner invoked by Mahler as a subprocess"
readme = "README.md"
authors = [
    { name = "Mike Kastellec", email = "215333050+mkny13@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.165",
]

[project.scripts]
mahler-sdk-run = "mahler_sdk_run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mahler_sdk_run"]
