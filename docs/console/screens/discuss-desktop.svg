<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
<title id="title">Talk it through — 1440px desktop</title><desc id="desc">Unapproved discussion design. Six annotated snapshots: Triage context, Capture draft/project selection, waiting, reply with issue links, quota unavailable, failure/retry. Example data only.</desc>
<rect width="1440" height="1440" fill="#f4f5f6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="42" font-size="22" fill="#0d1013" font-weight="600">MAHLER</text>
<text x="230" y="42" font-size="20" fill="#0d1013" font-weight="600">Needs you</text>
<text x="1100" y="42" font-size="14" fill="#8f4a06">Design proposal · Not approved</text>
<rect x="16" y="70" width="180" height="760" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="38" y="114" font-size="18" fill="#1256c4" font-weight="600">Triage</text>
<text x="38" y="158" font-size="15" fill="#0d1013">Now</text>
<text x="38" y="202" font-size="15" fill="#0d1013">What changed</text>
<text x="38" y="246" font-size="15" fill="#0d1013">Capture</text>
<rect x="218" y="90" width="610" height="225" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="242" y="125" font-size="14" fill="#a8180f" font-weight="600">Needs your answer</text>
<text x="242" y="163" font-size="23" fill="#0d1013" font-weight="600">Keep a draft after a failed discussion?</text>
<text x="242" y="195" font-size="14" fill="#4a5158">mahler #42 · Example issue</text>
<text x="242" y="233" font-size="15" fill="#0d1013">What should happen when a turn fails?</text>
<rect x="242" y="252" width="190" height="44" rx="8" fill="#1256c4" stroke="#d6dadd"/>
<text x="258" y="280" font-size="16" fill="#ffffff" font-weight="600">Talk it through</text>
<g id="triage">
<rect x="856" y="70" width="568" height="760" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="880" y="108" font-size="24" fill="#0d1013" font-weight="600">Talk it through</text>
<text x="1355" y="108" font-size="14" fill="#1256c4">Close</text>
<text x="880" y="144" font-size="14" fill="#4a5158">Triage context · mahler #42 ↗ · Personal subscription</text>
<text x="880" y="198" font-size="14" fill="#0d1013" font-weight="600">You</text>
<text x="880" y="233" font-size="15" fill="#0d1013">Keep my draft after a failed turn.</text>
<text x="880" y="298" font-size="14" fill="#0d1013" font-weight="600">Mahler</text>
<text x="880" y="333" font-size="15" fill="#0d1013">Should a failed turn keep your draft for retry?</text>
<text x="880" y="365" font-size="15" fill="#0d1013">I can save your answer on the issue.</text>
<rect x="880" y="648" width="520" height="80" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="896" y="680" font-size="16" fill="#4a5158">Write your reply…</text>
<text x="880" y="755" font-size="13" fill="#4a5158">Ctrl / Cmd + Enter to send · 0 / 8,000</text>
<rect x="1260" y="745" width="140" height="48" rx="8" fill="#1256c4" stroke="#d6dadd"/>
<text x="1300" y="775" font-size="16" fill="#ffffff" font-weight="600">Send</text>
</g>
<text x="242" y="365" font-size="15" fill="#4a5158">01 · Context stays visible beside the panel.</text>
<text x="242" y="401" font-size="15" fill="#4a5158">Closing returns focus to Talk it through.</text>
<text x="242" y="437" font-size="15" fill="#4a5158">Refresh preserves the draft and active session.</text>
<text x="32" y="875" font-size="22" fill="#0d1013" font-weight="600">State variants · same panel, never simultaneous</text>
<g id="capture">
<rect x="24" y="905" width="448" height="236" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="40" y="935" font-size="17" fill="#0d1013" font-weight="600">Capture draft/project selection</text>
<text x="40" y="963" font-size="12" fill="#4a5158">Capture · New discussion</text>
<text x="40" y="995" font-size="14" fill="#0d1013">Project: mahler  ▾</text>
<text x="40" y="1018" font-size="14" fill="#0d1013">Personal · Claude subscription</text>
<rect x="40" y="1072" width="175" height="44" rx="8" fill="#1256c4" stroke="#d6dadd"/>
<text x="52" y="1100" font-size="14" fill="#ffffff" font-weight="600">Send</text>
<text x="40" y="1134" font-size="11" fill="#4a5158">02 · Choose project before the first Send.</text>
</g>
<g id="waiting">
<rect x="496" y="905" width="448" height="236" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="512" y="935" font-size="17" fill="#0d1013" font-weight="600">Waiting</text>
<text x="512" y="963" font-size="12" fill="#4a5158">mahler · Personal · Project locked</text>
<text x="512" y="995" font-size="14" fill="#0d1013">Thinking…  12 seconds</text>
<text x="512" y="1018" font-size="14" fill="#0d1013">Up to 2 minutes. You can close this.</text>
<rect x="512" y="1072" width="175" height="44" rx="8" fill="#1256c4" stroke="#d6dadd"/>
<text x="524" y="1100" font-size="14" fill="#ffffff" font-weight="600">Send disabled</text>
<text x="512" y="1134" font-size="11" fill="#4a5158">03 · One active turn. Replies arrive together.</text>
</g>
<g id="reply">
<rect x="968" y="905" width="448" height="236" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="984" y="935" font-size="17" fill="#0d1013" font-weight="600">Reply with issue links</text>
<text x="984" y="963" font-size="12" fill="#4a5158">mahler · Personal · Project locked</text>
<text x="984" y="995" font-size="14" fill="#0d1013">I saved your answer. A failed turn will</text>
<text x="984" y="1018" font-size="14" fill="#0d1013">keep its message for an explicit retry.</text>
<text x="984" y="1041" font-size="14" fill="#0d1013">Confirmed issues</text>
<text x="984" y="1064" font-size="14" fill="#1256c4">Updated · mahler #42 ↗</text>
<rect x="984" y="1072" width="175" height="44" rx="8" fill="#1256c4" stroke="#d6dadd"/>
<text x="996" y="1100" font-size="14" fill="#ffffff" font-weight="600">Send</text>
<text x="984" y="1134" font-size="11" fill="#4a5158">04 · Links appear only after confirmed writes.</text>
</g>
<g id="quota">
<rect x="24" y="1163" width="448" height="236" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="40" y="1193" font-size="17" fill="#0d1013" font-weight="600">Quota unavailable</text>
<text x="40" y="1221" font-size="12" fill="#4a5158">mahler · Personal · Project locked</text>
<text x="40" y="1253" font-size="14" fill="#0d1013">Discussion quota is unavailable.</text>
<text x="40" y="1276" font-size="14" fill="#0d1013">Your draft is saved.</text>
<text x="40" y="1299" font-size="14" fill="#0d1013">Try again when quota is available.</text>
<rect x="40" y="1330" width="175" height="44" rx="8" fill="#1256c4" stroke="#d6dadd"/>
<text x="52" y="1358" font-size="14" fill="#ffffff" font-weight="600">Try again</text>
<text x="40" y="1392" font-size="11" fill="#4a5158">05 · No paid or cross-account fallback.</text>
</g>
<g id="failure">
<rect x="496" y="1163" width="448" height="236" rx="8" fill="#ffffff" stroke="#d6dadd"/>
<text x="512" y="1193" font-size="17" fill="#0d1013" font-weight="600">Failure/retry</text>
<text x="512" y="1221" font-size="12" fill="#4a5158">mahler · Personal · Project locked</text>
<text x="512" y="1253" font-size="14" fill="#0d1013">No reply within 2 minutes.</text>
<text x="512" y="1276" font-size="14" fill="#0d1013">Your message is saved.</text>
<text x="512" y="1299" font-size="14" fill="#0d1013">Confirmed issues</text>
<text x="512" y="1322" font-size="14" fill="#1256c4">Updated · mahler #42 ↗</text>
<rect x="512" y="1330" width="175" height="44" rx="8" fill="#1256c4" stroke="#d6dadd"/>
<text x="524" y="1358" font-size="14" fill="#ffffff" font-weight="600">Retry</text>
<text x="512" y="1392" font-size="11" fill="#4a5158">06 · Reconcile partial writes before retry.</text>
</g>
<text x="985" y="1210" font-size="19" fill="#0d1013" font-weight="600">Keyboard and refresh</text>
<text x="985" y="1248" font-size="15" fill="#0d1013">Tab stays in panel; Escape closes.</text>
<text x="985" y="1280" font-size="15" fill="#0d1013">A reply never steals keyboard focus.</text>
<text x="985" y="1312" font-size="15" fill="#0d1013">Reload reads state; it never resends.</text>
<text x="985" y="1360" font-size="14" fill="#8f4a06">Approval required before production UI.</text>
</g></svg>
